{{define "base"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">DataDex</a>
            <nav class="nav">
                <a href="/" class="{{if eq .ActivePage "home"}}active{{end}}">Accueil</a>
                <a href="/transactions" class="{{if eq .ActivePage "transactions"}}active{{end}}">Transactions</a>
                <a href="/favorites" class="{{if eq .ActivePage "favorites"}}active{{end}}">Favoris</a>
                <a href="/about" class="{{if eq .ActivePage "about"}}active{{end}}">À propos</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        {{template "content" .}}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>DataDex — Projet Go avec l'API Plaid Sandbox</p>
        </div>
    </footer>
</body>
</html>
{{end}}
